<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ComicCraft Studio · 漫画编辑器 MVP</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">✦</span><div><strong>ComicCraft Studio</strong><small>Codex 驱动的漫画工作台</small></div></div>
    <div class="top-actions"><span class="connection-dot"></span><span id="connectionText">本地编辑模式</span><button id="saveBtn" class="ghost-btn">保存项目</button><button id="exportProjectBtn" class="ghost-btn">导出 project.json</button><button id="loadProjectBtn" class="ghost-btn">载入项目</button><input id="projectFile" type="file" accept="application/json,.json" hidden><button id="exportBtn" class="primary-btn">导出 PNG</button></div>
  </header>
  <main class="workspace">
    <aside class="sidebar left-panel">
      <div class="panel-heading"><span>项目</span><button class="icon-btn" id="newEpisodeBtn" title="新建一话">＋</button></div>
      <div id="episodeList" class="episode-list"></div>
      <div class="panel-heading page-heading"><span>页面</span><button class="icon-btn" id="newPageBtn" title="新建页面">＋</button></div>
      <div id="pageList" class="page-list"></div>
      <div class="sidebar-foot"><span class="mini-label">项目状态</span><span class="status-pill ready">草稿</span></div>
    </aside>

    <section class="center-stage">
      <div class="stage-toolbar">
        <div class="crumb" id="crumb">第一话 / 第 1 页</div>
        <div class="tool-group"><button class="tool-btn active" data-tool="select">↖ 选择</button><button class="tool-btn" data-tool="pan">✋ 平移</button><button class="tool-btn" id="undoBtn" title="撤销">↶</button><button class="tool-btn" id="redoBtn" title="重做">↷</button><button class="tool-btn" id="zoomOut">−</button><span id="zoomValue">100%</span><button class="tool-btn" id="zoomIn">＋</button></div>
      </div>
      <div class="canvas-wrap" id="canvasWrap">
        <div class="canvas-shadow"></div>
        <svg id="comicCanvas" class="comic-canvas" viewBox="0 0 720 1000" role="application" aria-label="漫画画布">
          <defs>
            <linearGradient id="pageBackground" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6f8fc"/><stop offset="1" stop-color="#e9edf5"/></linearGradient>
            <linearGradient id="sampleGradient" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff7b67"/><stop offset="1" stop-color="#6037b8"/></linearGradient>
            <filter id="bubbleShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#131722" flood-opacity=".16"/></filter>
          </defs>
          <rect width="720" height="1000" fill="url(#pageBackground)"/>
          <g id="objectLayer"></g>
          <rect id="selectionBox" class="selection-box" x="0" y="0" width="0" height="0" visibility="hidden"/>
          <g id="selectionHandles" visibility="hidden"><rect class="handle nw"/><rect class="handle ne"/><rect class="handle sw"/><rect class="handle se"/></g>
        </svg>
      </div>
      <div class="stage-footer"><span>画布 720 × 1000</span><span id="selectionHint">选择一个对象开始编辑</span><span id="saveState">未保存</span></div>
    </section>

    <aside class="sidebar right-panel">
      <div class="inspector-section object-section"><div class="section-title">对象</div><div id="selectedObject" class="selected-object empty">未选择对象</div><div class="object-actions"><button id="duplicateBtn" class="small-btn" disabled>复制</button><button id="deleteBtn" class="small-btn danger" disabled>删除</button><button id="regenerateBtn" class="small-btn" disabled>重生成</button></div></div>
      <div class="inspector-section"><div class="section-title">图层</div><div id="layerTree" class="layer-tree"></div><div class="layer-order"><button id="moveUpBtn" class="small-btn">上移</button><button id="moveDownBtn" class="small-btn">下移</button></div><button id="addObjectBtn" class="add-object">＋ 添加对象</button></div>
      <div class="inspector-section properties"><div class="section-title">属性</div><div id="propertyForm" class="property-form empty-form">选择对象后编辑属性</div></div>
      <div class="inspector-section assets-section"><div class="section-title">资产</div><input id="assetFile" type="file" accept="image/*" hidden><button id="uploadAssetBtn" class="add-object">＋ 上传资产图</button><div id="assetList" class="asset-list"></div></div>
      <div class="inspector-section codex-section"><div class="section-title">脚本与标准</div><label class="prompt-label" for="storyboardText">分镜文本</label><textarea id="storyboardText" rows="2" placeholder="输入本页分镜说明"></textarea><label class="prompt-label" for="storyboardCsv">分镜表格 CSV</label><textarea id="storyboardCsv" rows="2" placeholder="panel_id,dialogue,prompt"></textarea><label class="prompt-label" for="generationStandard">生成标准文档</label><textarea id="generationStandard" rows="2" placeholder="画风、人物连续性、镜头规则"></textarea><label class="prompt-label" for="layoutReference">排版参考图标识</label><input id="layoutReference" class="text-input" placeholder="资产 ID 或路径"><label class="prompt-label" for="layoutPrompt">本页指令</label><textarea id="layoutPrompt" rows="3">保持人物连续性，主格突出冲突，副格补充动作。对白气泡留出安全边距。</textarea><button id="queueBtn" class="codex-btn"><span>✦</span> 排版 + 生图</button><div id="jobQueue" class="job-queue"></div></div>
    </aside>
  </main>
  <div id="toast" class="toast" role="status"></div>
  <template id="objectOptionTemplate"><button class="object-option"><span class="option-icon"></span><span class="option-label"></span></button></template>
  <script src="./app.js"></script>
</body>
</html>
